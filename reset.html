<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מבצר – שחזור קוד</title>
<style>
 body{margin:0;background:#F4F6FA;color:#1B2433;font-family:Arial,sans-serif;font-size:18px}
 header{background:#1E4FA3;color:#fff;padding:16px 20px;font-size:22px;font-weight:700}
 main{max-width:560px;margin:0 auto;padding:16px}
 .card{background:#fff;border:1px solid #E1E6EF;border-radius:14px;padding:18px}
 p{line-height:1.6}
 button{width:100%;margin-top:10px;font-size:17px;padding:13px;border-radius:12px;border:0;background:#F28C1E;color:#1B2433;font-family:inherit}
</style>
</head>
<body>
<header>מבצר – שחזור קוד</header>
<main><div class="card">
 <p>זה קישור לשחזור הקוד של מבצר.</p>
 <p><b>איך משתמשים:</b> העתק את הקישור הזה, פתח את מבצר ← "שכחתי את הקוד", והדבק אותו בשדה "קוד השחזור".</p>
 <p>אם הקישור נפתח בדפדפן מבצר – מסך השחזור נפתח לבד.</p>
 <button id="cp">העתקת הקישור</button>
</div></main>
<script>
document.getElementById('cp').onclick=function(){navigator.clipboard.writeText(location.href);this.textContent='✓ הועתק';};
</script>
<script src="a11y.js" defer></script>
</body>
</html>
